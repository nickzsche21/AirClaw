name: CI

on:
  push:
    branches: [main, airclaw-v3]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv pip install --system -e ".[dev]"
      - name: Lint
        run: ruff check airclaw tests
      - name: Test
        run: pytest -q
      - name: CLI smoke test
        run: |
          airclaw --version
          airclaw models
          airclaw detect || true   # no backend on CI runners; must exit cleanly
