[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "airclaw"
version         = "3.0.1"
description     = "Run OpenClaw on a local model. Zero API cost."
readme          = "README.md"
license         = { text = "MIT" }
requires-python = ">=3.10"
authors         = [{ name = "nickzsche21" }]
keywords        = ["openclaw", "local-llm", "ollama", "llama-cpp", "vllm",
                   "airllm", "ai-agent", "zero-cost", "openai-compatible"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Deliberately small. The gateway needs a web server and an HTTP client;
# torch and friends arrive only with the optional airllm extra.
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
airllm = ["airllm>=2.8.0", "torch>=2.0.0", "transformers>=4.40.0"]
dev    = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
airclaw = "airclaw.cli:main"

[project.urls]
Homepage = "https://github.com/nickzsche21/AirClaw"
Issues   = "https://github.com/nickzsche21/AirClaw/issues"

[tool.setuptools.packages.find]
where   = ["."]
include = ["airclaw*"]

[tool.setuptools.package-data]
airclaw = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Pinned explicitly so CI does not drift with ruff's default rule set.
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = [
    "E501",  # long lines are caught by the formatter, not worth failing CI over
    "B008",  # FastAPI dependency-injection idiom
]
